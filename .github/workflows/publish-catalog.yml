name: Publish catalog

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: qa
        options:
          - qa
          - prod

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: publish-catalog-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      PRODUCTS_CSV_URL: ${{ vars.PRODUCTS_CSV_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRFFLNGsXi5yKDodXA9fr7FTcsPMfAS1xIzjTPYVmSZsf99Mvx_LG9Of-2_k0b7GhCiryqDb3GK3UOQ/pub?output=csv' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPECTED_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate catalog publish config
        run: |
          required() {
            test -n "${!1}" || { echo "$1 is required"; exit 1; }
          }

          required PRODUCTS_CSV_URL
          required SUPABASE_URL
          required SUPABASE_SERVICE_ROLE_KEY
          required EXPECTED_SUPABASE_PROJECT_REF

          if [ "$TARGET_ENVIRONMENT" = "qa" ] && [ "$GITHUB_REF_NAME" != "dev" ]; then
            echo "QA catalog publish must run from the dev branch"
            exit 1
          fi

          if [ "$TARGET_ENVIRONMENT" = "prod" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Production catalog publish must run from the main branch"
            exit 1
          fi

      - run: pnpm typecheck

      - name: Generate catalog from CSV
        run: pnpm sync:products

      - name: Sync catalog to Supabase
        run: tsx scripts/sync-products-to-supabase.ts
